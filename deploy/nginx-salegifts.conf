# vhost для salegifts.ru (проект «Склад»).
#
# Живёт на сервере в /opt/nginx-vhosts/salegifts.conf и монтируется в nginx
# отдельным файлом. Намеренно НЕ внутри /opt/avtoservice/deploy/: выкатка
# автосервиса распаковывает архив поверх своего каталога, и файл, лежащий там,
# получал бы новый inode при каждом деплое. Bind-монтирование одиночного файла
# привязано к inode — именно поэтому конфиг автосервиса с 03.08.2026 не
# применялся четыре недели. Здесь файл никем не перезаписывается, inode
# стабилен, и правки подхватываются обычным `nginx -s reload`.
#
# Зоны лимитов (req_html, conn_ip) объявлены в default.conf автосервиса
# на уровне http и доступны отсюда.

server {
  listen 80;
  server_name salegifts.ru www.salegifts.ru;

  # Обновление сертификата Let's Encrypt ходит по HTTP — этот путь должен
  # оставаться доступным до редиректа, иначе продление будет падать.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://salegifts.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.salegifts.ru;

  ssl_certificate /etc/letsencrypt/live/salegifts.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/salegifts.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  return 301 https://salegifts.ru$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name salegifts.ru;

  ssl_certificate /etc/letsencrypt/live/salegifts.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/salegifts.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;

  # Админка принимает фото и видео товаров. Лимит выше, чем у автосервиса
  # (6m), но не безграничен: multer пишет загрузку на диск тома.
  client_max_body_size 32m;

  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  # Заголовки безопасности. add_header наследуется во вложенные location
  # только если там нет своего add_header, поэтому в каждом location ниже
  # они повторяются через include-подобное дублирование.
  #
  # HSTS намеренно без includeSubDomains: поддомены не проверены, а откатить
  # HSTS у клиента, который его уже закэшировал, нельзя. Срок для начала
  # умеренный — поднять до года после наблюдения.
  add_header Strict-Transport-Security "max-age=2592000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  # Content-Security-Policy пока не включаем: страницы отдают инлайновые
  # <script> (PRODUCT_DATA, обработчик оптовой формы, год в футере) и inline
  # style-атрибуты. Рабочая политика требует прокидывания nonce во все шаблоны
  # — это отдельная задача, а не строчка в конфиге. Без nonce единственный
  # вариант — 'unsafe-inline', который не даёт защиты и создаёт ложное чувство.

  # Express уже не отдаёт X-Powered-By; строка ниже — страховка на случай
  # отката приложения к прежней версии.
  proxy_hide_header X-Powered-By;

  # Вход в админку — самая привлекательная для перебора точка, поэтому строгая
  # зона: та же, что защищает /api/auth автосервиса (1 r/s, burst 5).
  location /api/login {
    limit_req zone=req_auth burst=5 nodelay;
    limit_conn conn_ip 10;
    proxy_pass http://sklad:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # Публичные формы: заказ и запрос оптового прайса. Пишут в файлы и шлют
  # уведомления в Telegram/почту, поэтому лимит тот же, что у логина, —
  # иначе форма превращается в канал рассылки спама менеджеру.
  location ~ ^/api/(order|wholesale-request)$ {
    limit_req zone=req_auth burst=5 nodelay;
    limit_conn conn_ip 10;
    proxy_pass http://sklad:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # Статика: раньше отдавалась с Cache-Control: max-age=0, то есть браузер
  # переспрашивал каждый файл на каждой странице. Сроки умеренные, потому что
  # в именах файлов нет хеша содержимого: и стили, и фото товара могут
  # замениться под тем же именем (деплой, загрузка фото из админки).
  # Длинный immutable-кэш станет возможен после версионирования имён.
  location ~* ^/(css|js)/ {
    proxy_pass http://sklad:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location ~* ^/(images|media|icons)/ {
    proxy_pass http://sklad:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location / {
    limit_req zone=req_html burst=60 nodelay;
    limit_conn conn_ip 20;
    proxy_pass http://sklad:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Приложение само редиректит на https, если этот заголовок говорит о http.
    # Без него оно решит, что запрос пришёл по незащищённому протоколу.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
}
