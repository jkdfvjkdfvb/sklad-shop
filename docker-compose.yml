# Отдельный compose-проект, намеренно не часть /opt/avtoservice.
#
# Если добавить склад сервисом в compose автосервиса, любая его выкатка
# (`docker compose up -d`) начнёт трогать и этот сайт. Здесь свой каталог,
# свой файл переменных и свой том — выкатка одного проекта физически не может
# задеть другой. Общим остаётся только nginx: порты 80 и 443 может занять
# лишь один процесс, поэтому он живёт в проекте автосервиса и проксирует сюда
# по имени домена.

services:
  sklad:
    build: .
    container_name: sklad-app-1
    restart: unless-stopped
    env_file: .env
    volumes:
      # Товары, заказы и загруженные через админку фото. Именованный том, а не
      # каталог в образе: пересборка образа не должна стирать данные.
      - sklad-data:/data
    # Порт наружу не публикуется: снаружи сайт доступен только через общий
    # nginx. Публикация 3000 на хост открыла бы приложение мимо TLS и мимо
    # rate-limit'ов.
    expose:
      - '3000'
    # Telegram-уведомления. 10.09.2026 два заказа сохранились, но уведомления
    # о них не ушли: контейнер не может открыть соединение с api.telegram.org.
    # Разбор:
    #   - DNS отдаёт единственный A-адрес 149.154.166.110 — с этого сервера он
    #     не отвечает (TCP 443 уходит в таймаут), провайдерская блокировка;
    #   - по IPv6 Telegram доступен, но глобального IPv6 у контейнеров нет, а
    #     включение net.ipv6.conf.all.forwarding на хосте роняет IPv6 у самого
    #     хоста (проверено 10.09.2026, откатили);
    #   - другой адрес того же API, 149.154.167.220, с этого сервера доступен
    #     и из контейнера тоже — проверено реальным вызовом getMe.
    # Поэтому фиксируем рабочий адрес здесь. TLS не страдает: подменяется
    # только резолв имени, SNI и проверка сертификата остаются для
    # api.telegram.org.
    # Адрес принадлежит Telegram и может смениться. Это не тихий отказ:
    # server.js проверяет ответ API, пишет причину в лог и помечает заказ, а
    # в админке у него появляется предупреждение о недоставленном уведомлении.
    extra_hosts:
      - 'api.telegram.org:149.154.167.220'
    networks:
      - avtoservice_default
    # Приложение на Express с тремя зависимостями укладывается в десятки
    # мегабайт. Лимит нужен не ему, а соседу: без него утечка здесь могла бы
    # выдавить из памяти автосервис — на сервере всего 3.8 ГБ, и 01.08.2026
    # OOM-killer уже срабатывал.
    mem_limit: 256m
    pids_limit: 256
    healthcheck:
      # Своего /healthz у приложения нет, поэтому проверяем корень. Заголовок
      # x-forwarded-proto не передаём: с ним приложение ответило бы редиректом
      # на https, и проверка изнутри контейнера всегда падала бы.
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  sklad-data:

networks:
  # Сеть создаёт compose автосервиса — здесь она только подключается.
  # Без общей сети nginx не сможет обратиться к контейнеру по имени.
  avtoservice_default:
    external: true
