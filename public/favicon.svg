<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="СкладПромо">
  <!-- Коробка со склада: три грани, читается даже в 16 пикселях. Палитра
       взята из style.css сайта — ink #111111 и акцент --sale #d30005. -->
  <rect width="64" height="64" rx="12" fill="#111111"/>
  <!-- верхняя грань -->
  <path d="M32 12 52 22 32 32 12 22z" fill="#ffffff"/>
  <!-- левая грань -->
  <path d="M12 22 32 32v20L12 42z" fill="#9e9ea0"/>
  <!-- правая грань, акцентом -->
  <path d="M52 22 32 32v20l20-10z" fill="#d30005"/>
</svg>
